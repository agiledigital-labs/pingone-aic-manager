name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # Asset target triple. The installer (install.sh) matches this string.
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build linux binary
    # Older glibc → binary runs on a broad range of Ubuntu/WSL versions.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --bin aic

      - name: Package tarball + checksum
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="aic-${version}-${TARGET}"
          mkdir -p dist
          strip target/release/aic || true
          tar -czf "dist/${name}.tar.gz" -C target/release aic
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          echo "tarball=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}

  publish-crate:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: cargo publish (skip if this version is already on crates.io)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if curl -sf "https://crates.io/api/v1/crates/pingone-aic-manager/${ver}" >/dev/null; then
            echo "crates.io already has pingone-aic-manager ${ver} — skipping publish."
          else
            cargo publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
