name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs before the build gate: it needs no toolchain, finishes in seconds, and
  # a leaked tenant identifier should fail the PR even if the code does not
  # compile. --selftest first, because a scanner whose rules silently stopped
  # matching would report every tree clean forever.
  metadata:
    name: sensitive metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scanner selftest
        env:
          REQUIRE_SENSITIVE_DENYLIST: "1"
          SENSITIVE_DENYLIST_CONTENT: ${{ secrets.SENSITIVE_METADATA_DENYLIST }}
        run: scripts/check-sensitive-metadata.sh --selftest

      - name: Scan tracked files
        env:
          REQUIRE_SENSITIVE_DENYLIST: "1"
          SENSITIVE_DENYLIST_CONTENT: ${{ secrets.SENSITIVE_METADATA_DENYLIST }}
        run: scripts/check-sensitive-metadata.sh --tracked

      # Scan every blob introduced anywhere in the pushed/PR commit series.
      # The final tree alone is insufficient: adding metadata in one commit and
      # deleting it in the next still publishes the first commit's blob.
      - name: Scan introduced history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUIRE_SENSITIVE_DENYLIST: "1"
          SENSITIVE_DENYLIST_CONTENT: ${{ secrets.SENSITIVE_METADATA_DENYLIST }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            scripts/check-sensitive-metadata.sh --history "$PR_BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            scripts/check-sensitive-metadata.sh --history "$BEFORE_SHA..$HEAD_SHA"
          else
            scripts/check-sensitive-metadata.sh --history
          fi

      # Orthogonal to the scanner above: that one knows the SHAPE of tenant and
      # client metadata, this one knows credentials — PEM/JWK material, API
      # secrets, provider tokens. Pinned to a release binary rather than
      # gitleaks-action, whose v2 wants a licence key for organisation repos.
      # Scans git history, which in CI is a superset of the checked-out tree.
      - name: Gitleaks (credentials)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner --exit-code 1

  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # hidapi (via ctap-hid-fido2, for security-key unlock) needs libudev at
      # build time. DuckDB/SQLite use bundled C/C++ (compiled with the runner's
      # g++), so no extra packages for those.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (default)
        run: cargo test

      # The DuckDB local log-store is behind the opt-in `logs-store` feature;
      # exercise it too so the gated code can't rot.
      - name: Clippy (logs-store)
        run: cargo clippy --all-targets --features logs-store -- -D warnings

      - name: Test (logs-store)
        run: cargo test --features logs-store

  script-types:
    name: script workspace types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The .d.ts files under src/scripts/templates/ carry real logic — the
      # `{}`-placeholder arity check, the managed-record `fields` projection —
      # and no cargo gate compiles any of it: the Rust tests check the strings
      # that emit those files, never what tsc makes of them.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TypeScript
        run: npm install --no-save typescript@5

      - name: Type tests (accept + reject)
        run: PATH="$PWD/node_modules/.bin:$PATH" scripts/type-tests/run.sh
