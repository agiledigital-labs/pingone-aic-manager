name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs before the build gate: it needs no toolchain, finishes in seconds, and
  # a leaked tenant identifier should fail the PR even if the code does not
  # compile. --selftest first, because a scanner whose rules silently stopped
  # matching would report every tree clean forever.
  metadata:
    name: sensitive metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scanner selftest
        env:
          REQUIRE_SENSITIVE_DENYLIST: "1"
          SENSITIVE_DENYLIST_CONTENT: ${{ secrets.SENSITIVE_METADATA_DENYLIST }}
        run: scripts/check-sensitive-metadata.sh --selftest

      - name: Scan tracked files
        env:
          REQUIRE_SENSITIVE_DENYLIST: "1"
          SENSITIVE_DENYLIST_CONTENT: ${{ secrets.SENSITIVE_METADATA_DENYLIST }}
        run: scripts/check-sensitive-metadata.sh --tracked

      # Scan every blob introduced anywhere in the pushed/PR commit series.
      # The final tree alone is insufficient: adding metadata in one commit and
      # deleting it in the next still publishes the first commit's blob.
      - name: Scan introduced history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUIRE_SENSITIVE_DENYLIST: "1"
          SENSITIVE_DENYLIST_CONTENT: ${{ secrets.SENSITIVE_METADATA_DENYLIST }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            scripts/check-sensitive-metadata.sh --history "$PR_BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            scripts/check-sensitive-metadata.sh --history "$BEFORE_SHA..$HEAD_SHA"
          else
            scripts/check-sensitive-metadata.sh --history
          fi

      # Orthogonal to the scanner above: that one knows the SHAPE of tenant and
      # client metadata, this one knows credentials — PEM/JWK material, API
      # secrets, provider tokens. Pinned to a release binary rather than
      # gitleaks-action, whose v2 wants a licence key for organisation repos.
      # Scans git history, which in CI is a superset of the checked-out tree.
      - name: Gitleaks (credentials)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner --exit-code 1

  # No toolchain and no network beyond the checkout, like the metadata job.
  # The repo is ~30 shell scripts and nothing linted any of them.
  shell:
    name: shellcheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Installed on the hosted image today; installing only when it is absent
      # means this step does not quietly stop running if that changes.
      - name: Shellcheck (all scripts)
        run: |
          command -v shellcheck >/dev/null 2>&1 \
            || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          scripts/shellcheck-all.sh

  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # hidapi (via ctap-hid-fido2, for security-key unlock) needs libudev at
      # build time. DuckDB/SQLite use bundled C/C++ (compiled with the runner's
      # g++), so no extra packages for those.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (default)
        run: cargo test

      # The DuckDB local log-store is behind the opt-in `logs-store` feature;
      # exercise it too so the gated code can't rot.
      - name: Clippy (logs-store)
        run: cargo clippy --all-targets --features logs-store -- -D warnings

      - name: Test (logs-store)
        run: cargo test --features logs-store

  # The declared MSRV was asserted by no gate, so a test calling a 1.89 API
  # (`File::try_lock_shared`) sat in the tree while production used libc::flock
  # and every green build agreed with it. Cheap on purpose: `cargo check`, not
  # the suite, because what rots here is what compiles, not what passes.
  # --all-targets is the whole point — the defect was in a test.
  #
  # This job was added on 2026-09-21 and its first run found the declaration
  # was fiction: `rust-version` said 1.85 and nothing in the tree had compiled
  # on it for a long time. It now reads 1.95, measured. Three independent
  # floors got it there, none of which any existing gate could see:
  #   - our own source needs 1.88 — let-chains, 24 sites in production code.
  #     `clippy::incompatible_msrv` checks std API stability, never language
  #     features, so it says nothing about these;
  #   - declared dependency floors reach 1.88 (jsonwebtoken, time, darling,
  #     instability, ctap-hid-fido2) and 1.86 (ratatui, icu);
  #   - `cargo check` actually fails until 1.95, because libsqlite3-sys
  #     0.38.1's build script uses `cfg_select!`, unstable through 1.94.
  #     Verified by compiling on 1.85, 1.88, 1.91, 1.92, 1.93 and 1.94.
  # Lowering it again is a dependency-pinning project, not an edit to
  # Cargo.toml: the let-chains in our own source would have to go too.
  msrv:
    name: msrv (Cargo.toml rust-version)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      # Read from Cargo.toml rather than repeated here: a pinned copy is a
      # second place to forget, and this job exists because of a first one.
      - name: Read the declared MSRV
        id: msrv
        run: |
          version="$(grep -oP '^rust-version = "\K[^"]+' Cargo.toml)"
          [ -n "$version" ] || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check (default)
        run: cargo check --all-targets

      - name: Check (logs-store)
        run: cargo check --all-targets --features logs-store

  script-types:
    name: script workspace types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The .d.ts files under src/scripts/templates/ carry real logic — the
      # `{}`-placeholder arity check, the managed-record `fields` projection —
      # and no cargo gate compiles any of it: the Rust tests check the strings
      # that emit those files, never what tsc makes of them.
      # 22, not 20: the TypeScript endpoint project declares
      # `"engines": { "node": "^22.18.0 || >=23.6.0" }`, and installing it under
      # an unsupported runtime is not a faithful run of the thing being gated
      # even while npm only warns about it.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install --no-save typescript@5

      - name: Type tests (accept + reject)
        run: PATH="$PWD/node_modules/.bin:$PATH" scripts/type-tests/run.sh

      # The TypeScript endpoint project is the THIRD copy of the managed-record
      # type machinery (`framework/idm-globals.d.ts`), and it carries the only
      # bidirectional test of it: `tests/openidm-types.test.ts` is a wall of
      # `@ts-expect-error` markers, which mean nothing unless a compiler reads
      # them. Nothing ran that compiler in CI.
      #
      # `npm run type-check` is the project's own entry point and runs BOTH
      # programs — the endpoint program is pinned to the narrow IDM runtime lib
      # while the tests run under node — so this keeps working if those
      # tsconfigs change. No lockfile is tracked, hence `install` and not `ci`.
      - name: TypeScript project type-check
        working-directory: src/scripts/templates/typescript
        run: |
          npm install --no-audit --no-fund
          npm run type-check
