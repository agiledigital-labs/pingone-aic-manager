[package]
name = "pingone-aic-manager"
version = "0.8.1"
edition = "2024"
rust-version = "1.85"
description = "Ratatui TUI for managing PingOne Advanced Identity Cloud configuration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agiledigital-labs/pingone-aic-manager"
readme = "README.md"
keywords = ["pingone", "identity", "forgerock", "tui", "cli"]
categories = ["command-line-utilities"]
# Keep the published crate lean — ship only what building/using it needs.
# Leading slashes anchor to the package root so `/scripts` does NOT match the
# in-tree `src/scripts/templates/*` that `include_str!` depends on.
exclude = [
    "/docs",
    "/.github",
    "/scripts",
    "/install.sh",
    "/PLAN.md",
    "/shell.nix",
]

# Short binary name — `aic` instead of `pingone-aic-manager`. The library crate
# keeps the longer name (referenced as `pingone_aic_manager::…` in src/main.rs).
[[bin]]
name = "aic"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# JWT signing from JWK (service-account RFC7523 bearer flow).
# Pure-Rust stack — avoids the openssl-sys system dependency.
# jsonwebtoken handles RS256; rsa parses the JWK components into a key.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rsa = "0.9"
sha2 = "0.11"
base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File watcher for two-way script sync
notify = "8"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

dotenvy = "0.15"

# Encryption at rest
argon2    = "0.5"
aes-gcm   = "0.10"
rand      = "0.8"
zeroize   = { version = "1", features = ["derive"] }

# Browser handoff (PKCE localhost callback)
webbrowser      = "1"
hyper           = { version = "1", features = ["server", "http1"] }
hyper-util      = { version = "0.1", features = ["tokio"] }
http-body-util  = "0.1"
url             = "2"

# RSA key handling
num-bigint-dig = "0.8"
pkcs8          = { version = "0.10", features = ["alloc"] }

# Misc
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
toml        = "0.8"
directories = "5"

# Security keys (FIDO2 hmac-secret) — talks CTAP2 over USB HID to the device.
# We initially tried webauthn-authenticator-rs but its USB backend
# (`fido-hid-rs`) needs `libudev` + bindgen/libclang at build time, which
# isn't available out of the box on NixOS without a shell.nix.
# `ctap-hid-fido2` wraps `hidapi-rs` and builds clean against just the
# stock toolchain.
ctap-hid-fido2 = "3.5.10"

# CLI + agent
clap       = { version = "4", features = ["derive"] }
rpassword  = "7"
libc       = "0.2"

# Interactive single-select fuzzy picker for `aic script pull`/`push` with no
# argument (type to filter, enter to choose).
inquire    = "0.7"

# Fuzzy matching for the ESV search (`/`) — the helix editor's matcher,
# small, no_std-friendly, returns scored matches + indices we can use to
# highlight matched chars in the list.
nucleo-matcher = "0.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
duckdb = { version = "1.4", features = ["bundled", "json", "chrono"], optional = true }

[features]
logs-store = ["dep:duckdb"]
