[package]
name = "aic-edit"
version = "0.1.0"
edition = "2021"
description = "Ratatui TUI for managing PingOne Advanced Identity Cloud configuration"

# Short binary name — `aic` instead of `aic-edit`. The library crate keeps the
# longer name (referenced as `aic_edit::…` in src/main.rs).
[[bin]]
name = "aic"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# JWT signing from JWK (service-account RFC7523 bearer flow).
# Pure-Rust stack — avoids the openssl-sys system dependency.
# jsonwebtoken handles RS256; rsa parses the JWK components into a key.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rsa = "0.9"
sha2 = "0.11"
base64 = "0.22"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File watcher for two-way script sync
notify = "8"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

dotenvy = "0.15"

# Encryption at rest
argon2    = "0.5"
aes-gcm   = "0.10"
rand      = "0.8"
zeroize   = { version = "1", features = ["derive"] }

# Browser handoff (PKCE localhost callback)
webbrowser      = "1"
hyper           = { version = "1", features = ["server", "http1"] }
hyper-util      = { version = "0.1", features = ["tokio"] }
http-body-util  = "0.1"
url             = "2"

# RSA key handling
num-bigint-dig = "0.8"
pkcs8          = { version = "0.10", features = ["alloc"] }

# Misc
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = "0.4"
toml        = "0.8"
directories = "5"

# Security keys (FIDO2 hmac-secret) — talks CTAP2 over USB HID to the device.
# We initially tried webauthn-authenticator-rs but its USB backend
# (`fido-hid-rs`) needs `libudev` + bindgen/libclang at build time, which
# isn't available out of the box on NixOS without a shell.nix.
# `ctap-hid-fido2` wraps `hidapi-rs` and builds clean against just the
# stock toolchain.
ctap-hid-fido2 = "3.5.10"

# CLI + agent
clap       = { version = "4", features = ["derive"] }
rpassword  = "7"
libc       = "0.2"

# Fuzzy matching for the ESV search (`/`) — the helix editor's matcher,
# small, no_std-friendly, returns scored matches + indices we can use to
# highlight matched chars in the list.
nucleo-matcher = "0.3"
