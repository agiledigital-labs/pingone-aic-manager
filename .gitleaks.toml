# Gitleaks configuration.
#
# CI runs `gitleaks git .` over the whole history for the class
# `check-sensitive-metadata.sh` deliberately does not cover: PEM/JWK material,
# API secrets, provider tokens. This file extends the stock ruleset; it never
# replaces it.
#
# Allowlist entries go in by SHAPE, not by fingerprint. A fingerprint pins a
# commit hash, and this repo's history has been rewritten once already — every
# fingerprint recorded before that rewrite now names a commit that does not
# exist. A shape survives the rewrite and covers the next occurrence too.

[extend]
useDefault = true

[[allowlists]]
description = """
AM script ids are UUIDs, and several of the config keys that hold one contain
the substring "Token" (accessTokenModificationScript, accessTokenMayActScript).
The stock generic-api-key rule reads that as a token assignment. The value is
an object id — it names a script, it does not authenticate anything, and it is
useless without a bearer for the tenant that holds it.

Narrow on purpose: the key must end in "Script" and the value must be a bare
lowercase UUID. A real secret in one of these fields would not be UUID-shaped,
and Azure tenant GUIDs — the one UUID in this project that IS sensitive — are
caught by rule 3 of scripts/check-sensitive-metadata.sh, which gitleaks does
not duplicate.
"""
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''(?i)script"?\s*[:=]\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''',
]

[[allowlists]]
description = """
The rhino-local binding corpus keys its probe payloads by slash-joined paths
(`encrypt/RSA/generatedKey`, `digest/AES/HMAC`). When one follows a word that
contains "key", generic-api-key reads the path as the key's value.

Narrow on purpose. Both conditions must hold. The file must be the corpus index
or its snapshots, and the value must be two or more letter-only segments joined
by "/". A base64 secret in the same place would carry digits, "+" or "=", and it
still fires.
"""
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^[A-Za-z]+(?:/[A-Za-z]+)+$''']
paths = ['''^packages/rhino-local/(?:cases/real/index\.ts|test/corpus/__snapshots__/real\.test\.ts\.snap)$''']

[[allowlists]]
description = """
The ascending hex run "0123456789abcdef", repeated, is a published test vector
(the binding-services probe signs a throwaway JWT with it). It is a value no
generator produces. Any other hex string in the same key still fires.
"""
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(?:0123456789abcdef)+$''']
